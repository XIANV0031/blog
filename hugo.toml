baseURL = 'https://xianv0031.github.io/blog/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = '海鸥工业集团宣传部'
theme = 'PaperMod'
paginate = 10
enableRobotsTXT = true
hasCJKLanguage = true
# 允许渲染 date 位于当前时刻之后的文章。
# 自动化任务在清晨运行，而简报 front matter 的 date 常写为当日稍晚的时间，
# 若不开此项，Hugo 会把文章判定为「未来文章」并静默排除出构建产物。
buildFuture = true

# 首页改由 content/_index.md 驱动（layout: "about"），
# 不再用主题的 homeInfoParams 面板 —— 所以这一段整个删掉了。
# 若想恢复旧的情报站首页，把 [params.homeInfoParams] 加回来并删掉
# content/_index.md 的 layout 字段即可。

[params]
  description = '个人博客 · 军事方向 · 服装与装备科普'
  author = 'XIANV0031'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  defaultTheme = 'dark'
  # 明暗切换按钮已按用户要求移除（2026-09-20）。
  # ⚠️ 必须为 true，否则主题会输出切换按钮及其监听脚本，
  #    且 head 内的初始化脚本会读取 localStorage.pref-theme 而可能渲染亮色。
  #    配合 layouts/_partials/extend_head.html 的强制锁定脚本一起生效。
  disableThemeToggle = true
  DateFormat = '2006-01-02'
  comments = true          # 开启评论区（模板见 layouts/_partials/comments.html）

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/XIANV0031'

  # ---------- 评论区 / 点赞（Giscus）----------
  # 首次启用需在 GitHub 侧完成两件事：
  #   1. 仓库 Settings → Features 勾选 Discussions
  #   2. 安装 Giscus App：https://github.com/apps/giscus
  # 然后在 https://giscus.app/zh-CN 填入仓库并获取 repoId / categoryId。
  [params.giscus]
    enable = true
    repo = 'XIANV0031/blog'
    repoId = 'R_kgDOUf4S8w'
    category = 'Announcements'
    categoryId = 'DIC_kwDOUf4S884DF8rm'   # 从 giscus.app 获取（Announcements 分类）
    mapping = 'pathname'                 # 与 giscus.app 上的映射设置保持一致
    strict = '0'
    reactionsEnabled = '1'               # 1 = 显示点赞/表情反应
    emitMetadata = '0'
    inputPosition = 'bottom'
    theme = 'preferred_color_scheme'     # 自动跟随明暗主题
    lang = 'zh-CN'
    loading = 'lazy'


  # 站点徽标：显示在导航栏站名左侧（主题原生支持 params.label.icon）
  [params.label]
    icon = "images/brand/logo-128.png"
    iconHeight = 30

[menu]
  [[menu.main]]
    name = '首页'
    url = '/'
    weight = 10
  [[menu.main]]
    name = '更新列表'
    url = '/updates/'
    weight = 20
    # 归档区挂在「更新列表」下面，不占顶层位置
    [[menu.main]]
      name = 'Wargame 归档'
      url = '/wargame/'
      weight = 21
      parent = '更新列表'
  [[menu.main]]
    name = '装备资料'
    identifier = 'gear'
    url = '/gear/'
    weight = 30
    # 下拉子项（PaperMod 原生不支持嵌套菜单，由 layouts/_partials/header.html 自行渲染）
    # ⚠️ 每个分栏下都有一套「国家 → 美国 → 服装/护具」，菜单项重名会让
    #    Hugo 按名字匹配 parent 时挂错分支，所以一律用唯一 identifier。
    [[menu.main]]
      name = '国家'
      identifier = 'nation'
      url = '/gear/nation/'
      weight = 31
      parent = 'gear'
      [[menu.main]]
        name = '美国'
        identifier = 'nation-usa'
        url = '/gear/nation/usa/'
        weight = 311
        parent = 'nation'
        [[menu.main]]
          name = '服装'
          identifier = 'nation-usa-uniform'
          url = '/gear/nation/usa/uniform/'
          weight = 3111
          parent = 'nation-usa'
        [[menu.main]]
          name = '护具'
          identifier = 'nation-usa-headgear'
          url = '/gear/nation/usa/headgear/'
          weight = 3112
          parent = 'nation-usa'
    [[menu.main]]
      name = '特辑'
      identifier = 'special'
      url = '/gear/special/'
      weight = 32
      parent = 'gear'
    [[menu.main]]
      name = '公司'
      identifier = 'company'
      url = '/gear/company/'
      weight = 33
      parent = 'gear'
  [[menu.main]]
    name = '本站说明及联系方式'
    url = '/about/'
    weight = 40

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup]
  [markup.goldmark]
    # ⚠️ 必须关掉「独占段落的图片自动包 <p>」：
    # 否则 ![alt](src "title") 会被渲染成 <p><figure>...</figure></p>。
    # <figure> 嵌在 <p> 内是非法 HTML，浏览器会把 <p> 提前闭合并把
    # figure 提到外面，DOM 结构与源码不一致，CSS 选择器容易失准。
    # 关掉后 Goldmark 直接用 <figure> 包裹，配合
    # layouts/_markup/render-image.html 输出 <figcaption> 承载图注。
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      # ⚠️ 必须开启 attribute 扩展，否则 Markdown 里的 `{class="..."}`
      # 属性块不会被解析，render hook 里 .Attributes 为空 →
      # class 属性静默丢失（不报错，极难排查）。
      # 用途：给特定图片挂类，如超宽横幅图的 {class="wide-banner"}。
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = 'monokai'
