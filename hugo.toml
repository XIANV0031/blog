baseURL = 'https://xianv0031.github.io/blog/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = '境外 GBB/AEG 简报'
theme = 'PaperMod'
paginate = 10
enableRobotsTXT = true
hasCJKLanguage = true
# 允许渲染 date 位于当前时刻之后的文章。
# 自动化任务在清晨运行，而简报 front matter 的 date 常写为当日稍晚的时间，
# 若不开此项，Hugo 会把文章判定为「未来文章」并静默排除出构建产物。
buildFuture = true

[params]
  description = '每日自动采集境外（Reddit 等）GBB/AEG 资讯，排除全部国内平台'
  author = 'XIANV0031'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  defaultTheme = 'dark'
  disableThemeToggle = false
  DateFormat = '2006-01-02'
  comments = true          # 开启评论区（模板见 layouts/_partials/comments.html）

  [params.homeInfoParams]
    Title = '境外 GBB/AEG 简报'
    Content = '''
只采集境外信源（Reddit、YouTube、境外行业媒体等），
**完全排除国内平台**。每日自动更新。
'''

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/XIANV0031'

  # ---------- 评论区 / 点赞（Giscus）----------
  # 首次启用需在 GitHub 侧完成两件事：
  #   1. 仓库 Settings → Features 勾选 Discussions
  #   2. 安装 Giscus App：https://github.com/apps/giscus
  # 然后在 https://giscus.app/zh-CN 填入仓库并获取 repoId / categoryId。
  [params.giscus]
    enable = true
    repo = 'XIANV0031/blog'
    repoId = 'R_kgDOUf4S8w'
    category = 'Announcements'
    categoryId = 'DIC_kwDOUf4S884DF8rm'   # 从 giscus.app 获取（Announcements 分类）
    mapping = 'pathname'                 # 与 giscus.app 上的映射设置保持一致
    strict = '0'
    reactionsEnabled = '1'               # 1 = 显示点赞/表情反应
    emitMetadata = '0'
    inputPosition = 'bottom'
    theme = 'preferred_color_scheme'     # 自动跟随明暗主题
    lang = 'zh-CN'
    loading = 'lazy'


[menu]
  [[menu.main]]
    name = '首页'
    url = '/'
    weight = 10
  [[menu.main]]
    name = '归档'
    url = '/archives/'
    weight = 20
  [[menu.main]]
    name = '标签'
    url = '/tags/'
    weight = 30
  [[menu.main]]
    name = '搜索'
    url = '/search/'
    weight = 40

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = 'monokai'
