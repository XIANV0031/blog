baseURL = 'https://xianv0031.github.io/blog/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = 'WAR GAME 情报站'
theme = 'PaperMod'
paginate = 10
enableRobotsTXT = true
hasCJKLanguage = true
# 允许渲染 date 位于当前时刻之后的文章。
# 自动化任务在清晨运行，而简报 front matter 的 date 常写为当日稍晚的时间，
# 若不开此项，Hugo 会把文章判定为「未来文章」并静默排除出构建产物。
buildFuture = true

[params]
  description = 'Wargame 资讯博客 · 双周轮换：一周国内（SDGUN 论坛 / B站）、一周国际（Reddit / 境外媒体）'
  author = 'XIANV0031'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  defaultTheme = 'dark'
  # 明暗切换按钮已按用户要求移除（2026-09-20）。
  # ⚠️ 必须为 true，否则主题会输出切换按钮及其监听脚本，
  #    且 head 内的初始化脚本会读取 localStorage.pref-theme 而可能渲染亮色。
  #    配合 layouts/_partials/extend_head.html 的强制锁定脚本一起生效。
  disableThemeToggle = true
  DateFormat = '2006-01-02'
  comments = true          # 开启评论区（模板见 layouts/_partials/comments.html）

  [params.homeInfoParams]
    Title = 'WAR GAME 情报站'
    Content = '''
**双轨轮换** 一周国内、一周国际，每周一 08:00 自动采集与发布。

**国内源** SDGUN 水弹论坛（装备测评 / 改装 / 新品爆料）+ B站（下场实战视频、专栏长文科普）。

**国际源** Reddit r/airsoft（社群一手反馈）+ 境外垂直媒体（Popular Airsoft 等）。

**主题范围** Wargame 器材与装备动态、下场战术、厂商新品、社群热议、二手行情。
'''

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/XIANV0031'

  # ---------- 评论区 / 点赞（Giscus）----------
  # 首次启用需在 GitHub 侧完成两件事：
  #   1. 仓库 Settings → Features 勾选 Discussions
  #   2. 安装 Giscus App：https://github.com/apps/giscus
  # 然后在 https://giscus.app/zh-CN 填入仓库并获取 repoId / categoryId。
  [params.giscus]
    enable = true
    repo = 'XIANV0031/blog'
    repoId = 'R_kgDOUf4S8w'
    category = 'Announcements'
    categoryId = 'DIC_kwDOUf4S884DF8rm'   # 从 giscus.app 获取（Announcements 分类）
    mapping = 'pathname'                 # 与 giscus.app 上的映射设置保持一致
    strict = '0'
    reactionsEnabled = '1'               # 1 = 显示点赞/表情反应
    emitMetadata = '0'
    inputPosition = 'bottom'
    theme = 'preferred_color_scheme'     # 自动跟随明暗主题
    lang = 'zh-CN'
    loading = 'lazy'


[menu]
  [[menu.main]]
    name = '首页'
    url = '/'
    weight = 10
  [[menu.main]]
    name = '归档'
    url = '/archives/'
    weight = 20
  [[menu.main]]
    name = '标签'
    url = '/tags/'
    weight = 30
  [[menu.main]]
    name = '搜索'
    url = '/search/'
    weight = 40

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup]
  [markup.goldmark]
    # ⚠️ 必须关掉「独占段落的图片自动包 <p>」：
    # 否则 ![alt](src "title") 会被渲染成 <p><figure>...</figure></p>。
    # <figure> 嵌在 <p> 内是非法 HTML，浏览器会把 <p> 提前闭合并把
    # figure 提到外面，DOM 结构与源码不一致，CSS 选择器容易失准。
    # 关掉后 Goldmark 直接用 <figure> 包裹，配合
    # layouts/_markup/render-image.html 输出 <figcaption> 承载图注。
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      # ⚠️ 必须开启 attribute 扩展，否则 Markdown 里的 `{class="..."}`
      # 属性块不会被解析，render hook 里 .Attributes 为空 →
      # class 属性静默丢失（不报错，极难排查）。
      # 用途：给特定图片挂类，如超宽横幅图的 {class="wide-banner"}。
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = 'monokai'
